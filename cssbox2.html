<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum CSS Box 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .box-hijau {
            width: 100%;
            height: 100px;
            background-color: #a8d890;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .baris {
            width: 100%;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .box-kuning {
            width: 22%;
            height: 160px;
            background-color: #ece648;
            border: 1px solid #333;
            float: left;
        }

        .box-oranye {
            width: 75%;
            height: 160px;
            background-color: #f4621f;
            border: 1px solid #333;
            float: right;
        }

        .box-biru {
            width: 75%;
            height: 160px;
            background-color: #4dd0f1;
            border: 1px solid #333;
            float: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box-hijau"></div>

        <div class="baris">
            <div class="box-kuning"></div>
            <div class="box-oranye"></div>
        </div>

        <div class="baris">
            <div class="box-kuning"></div>
            <div class="box-biru"></div>
        </div>
    </div>

</body>
</html>
