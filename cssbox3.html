<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum CSS Box 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .baris {
            width: 100%;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .box-kuning {
            width: 20%;
            height: 60px;
            background-color: #ece648;
            border: 1px solid #333;
            float: left;
        }

        .box-oranye {
            width: 78%;
            height: 60px;
            background-color: #f4621f;
            border: 1px solid #333;
            float: right;
        }

        .box-hijau {
            width: 20%;
            height: 360px;
            background-color: #a8d890;
            border: 1px solid #333;
            float: left;
            margin-right: 2%;
        }

        .box-abu {
            width: 56%;
            height: 360px;
            background-color: #d3d5d8;
            border: 1px solid #333;
            float: left;
        }

        .box-biru-muda {
            width: 20%;
            height: 360px;
            background-color: #4dd0f1;
            border: 1px solid #333;
            float: right;
        }

        .box-biru-tua {
            width: 100%;
            height: 55px;
            background-color: #1665e3;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="baris">
            <div class="box-kuning"></div>
            <div class="box-oranye"></div>
        </div>

        <div class="baris">
            <div class="box-hijau"></div>
            <div class="box-abu"></div>
            <div class="box-biru-muda"></div>
        </div>

        <div class="box-biru-tua"></div>
    </div>

</body>
</html>
