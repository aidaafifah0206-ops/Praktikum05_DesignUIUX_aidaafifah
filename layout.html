<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <header>Header</header>
    <main>
        <article>Article</article>
        <aside>Aside</aside>
        <nav>Nav</nav>
    </main>
    <footer>Footer</footer>

    <div class="gallery-container">
        <div class="flex-row">
            <div class="flex-item"></div>
            <div class="flex-item"></div>
            <div class="flex-item"></div>
        </div>

        <div class="flex-row">
            <div class="flex-item"></div>
            <div class="flex-item"></div>
            <div class="flex-item"></div>
            <div class="flex-item"></div>
            <div class="flex-item"></div>
        </div>
    </div>

    <div class="layout-a">
        <nav>Nav</nav>
        <div class="main-col">
            <header>Header</header>
            <div class="middle-row">
                <article>Article</article>
                <aside>Aside</aside>
            </div>
            <footer>Footer</footer>
        </div>
    </div>

    <div class="layout-b">
        <header>Header</header>
        <div class="middle-row">
            <aside>Aside</aside>
            <article>
                <div>Article</div>
                <div class="image-group">
                    <div class="img-box">Image</div>
                    <div class="img-box">Image</div>
                    <div class="img-box">Image</div>
                </div>
            </article>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>
